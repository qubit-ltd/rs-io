name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  rust-ci:
    uses: qubit-ltd/rs-ci/.github/workflows/rust-ci.yml@main
    secrets: inherit

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Miri toolchain
        run: >-
          rustup toolchain install nightly-2026-06-05
          --profile minimal
          --component miri
      - name: Run Miri tests
        run: cargo +nightly-2026-06-05 miri test --all-features
