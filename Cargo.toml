[package]
name = "qubit-io"
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-io"
description = "Byte-stream buffering and std::io utilities for Rust"
homepage = "https://github.com/qubit-ltd/rs-io"
documentation = "https://docs.rs/qubit-io"
readme = "README.md"
keywords = ["io", "read", "write", "seek", "qubit"]
categories = ["rust-patterns"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_io"
doctest = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
