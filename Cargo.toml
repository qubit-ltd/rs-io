[package]
name = "qubit-io"
version = "0.19.3"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-io"
description = "Runtime-neutral synchronous and asynchronous item-stream I/O for Rust"
homepage = "https://github.com/qubit-ltd/rs-io"
documentation = "https://docs.rs/qubit-io"
readme = "README.md"
keywords = ["io", "async", "stream", "buffer", "qubit"]
categories = ["rust-patterns"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/user_guide.md",
    "/doc/user_guide.zh_CN.md",
    "/examples/**",
    "/tests/**",
    "/benches/**",
]

[lib]
name = "qubit_io"
doctest = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.rs-infra]
miri = true
sanitizers = ["address"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(miri)'] }

[features]
default = []
digest = ["dep:digest"]
futures-io = ["dep:futures-io"]
tokio = ["dep:tokio"]

[dependencies]
digest = { version = "^0.11", optional = true, default-features = false }
qubit-utils = "^0.3"
futures-io = { version = "^0.3", optional = true }
tokio = { version = "^1.54", features = ["io-util"], optional = true }

[dev-dependencies]
sha2 = "^0.11"
criterion = { version = "^0.8", default-features = false }

