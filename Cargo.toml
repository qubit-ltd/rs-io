[package]
name = "qubit-io"
version = "0.13.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-io"
description = "Runtime-neutral synchronous and asynchronous item-stream I/O for Rust"
homepage = "https://github.com/qubit-ltd/rs-io"
documentation = "https://docs.rs/qubit-io"
readme = "README.md"
keywords = ["io", "async", "stream", "buffer", "qubit"]
categories = ["rust-patterns"]
include = [
    "/Cargo.toml",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
    "!/tests/ext/internal/**",
]

[lib]
name = "qubit_io"
doctest = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[features]
default = []
futures-io = ["dep:futures-io"]
tokio = ["dep:tokio"]

[dependencies]
futures-io = { version = "0.3", optional = true }
tokio = { version = "1", features = ["io-util"], optional = true }
